name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 24.04: Dovecot 2.3, compatibile con test/setup-dovecot.sh (Ubuntu 26 porta Dovecot 2.4, con un altro formato)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Dovecot (test IMAP server)
        run: sudo apt-get update && sudo apt-get install -y dovecot-imapd
      - name: Start test IMAP server
        run: sudo test/setup-dovecot.sh
      - run: npm ci --omit=dev
      - run: npm run test:local
